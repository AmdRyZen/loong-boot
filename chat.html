            color: var(--hm-text-primary);
            height: 100vh;

            justify-content: center;

            overflow: hidden;
            position: relative;
        }

        .aurora-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        /* 鸿蒙星芒粒子动效画布 */
        #particleCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .aurora-blob {
            position: absolute;
            filter: blur(90px);
            opacity: 0.38;
            border-radius: 50%;
            animation: auroraFloat 18s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, #2251B5 0%, transparent 70%);
            top: -120px;
            left: -80px;
        }

        .blob-2 {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, #18987E 0%, transparent 70%);
            bottom: -100px;
            right: -60px;
            animation-duration: 22s;
            animation-delay: -5s;
        }

        .blob-3 {
            width: 360px;
            height: 360px;
            background: radial-gradient(circle, #55348C 0%, transparent 70%);
            top: 40%;
            left: 55%;
            animation-duration: 20s;
        }

        @keyframes auroraFloat {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 40px) scale(1.1); }
            100% { transform: translate(-40px, 70px) scale(0.95); }
        }

        /* 鸿蒙沉浸式悬浮容器 */
        .hm-window {
            position: relative;
            z-index: 1;
            width: 95vw;
            max-width: 1040px;
            height: 94vh;
            background: var(--hm-glass);
            backdrop-filter: blur(35px) saturate(190%);
            -webkit-backdrop-filter: blur(35px) saturate(190%);
            border: 1px solid var(--hm-line);
            border-radius: var(--hm-r-lg);
            display: flex;
            flex-direction: column;
            box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            overflow: hidden;
        }

        /* 沉浸式胶囊导航 */
        .hm-header {
            padding: 16px 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--hm-line);
            background: rgba(255, 255, 255, 0.02);

        .hm-brand {

            align-items: center;
            gap: 12px;

        .hm-logo {

            height: 34px;

            background: linear-gradient(135deg, #3E7BFA 0%, #2FD0B5 100%);

            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px var(--hm-blue-glow);

            height: 20px;
            fill: #ffffff;
        }

        .hm-title {
            font-size: 1.05rem;
            font-weight: 500;

        /* 底部输入舱 */

        }

        .hm-input-box::placeholder {
            color: var(--hm-text-tertiary);
        }

    <script>
        let ws = null;
        let sentTotal = 0;
        let recvTotal = 0;
        let lastRecv = 0;

        // 断线自动重连（指数退避）。
        // 原先 onclose 只把 UI 改成「已断开」，弱网/服务端重启后必须手动点连接。
        let reconnectAttempts = 0;
        let reconnectTimer = null;
        let manualClose = false;              // 用户主动断开时不重连
        const MAX_RECONNECT_ATTEMPTS = 10;
        const MAX_RECONNECT_DELAY_MS = 15000;
        // 发送缓冲上限：超过就说明链路已经跟不上，继续塞只会让客户端内存上涨
        const MAX_BUFFERED_BYTES = 1 << 20;   // 1 MiB

        // 窗口初始化：随机独立昵称
        window.addEventListener('DOMContentLoaded', () => {
            const randomId = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('userName').value = `User_${randomId}`;
        });

        // 环形缓冲：最多保留 200 条，杜绝 DOM 树无界膨胀
        const MAX_MESSAGES = 200;

        // QPS 吞吐量实时计算器 (每秒计算)
        setInterval(() => {
            const currentQps = recvTotal - lastRecv;
            lastRecv = recvTotal;
            document.getElementById('qpsVal').innerText = `${currentQps.toLocaleString()} msg/s`;
        }, 1000);

        // ------------------------------------------------------------------
        // 应用层心跳
        //
        // 服务端每 5 秒扫描一次连接，超过 60 秒没收到【客户端任意帧】就 forceClose。
        //
        // 注意：drogon 的 HttpServer 对每条 WebSocket 连接默认执行
        //   wsConn->setPingMessage("", 30s)
        // 即每 30 秒主动发一次协议层 Ping，浏览器会自动回 Pong —— 而 Pong 同样会
        // 刷新服务端的活动时间。所以正常情况下连接不会被误杀，这条应用层心跳属于
        // 【纵深防御】：它探测的是「TCP/协议栈还活着、但前端 JS 已经卡死」的场景，
        // 那种情况下协议层 Pong 仍会自动回复，只有应用层心跳会停。
        //
        // 心跳用 action="ping"：服务端只在 action=="message" 时才广播，
        // 因此它不会出现在聊天记录里，也不计入 QPS 统计。
        // ------------------------------------------------------------------
        const HEARTBEAT_MS = 25000;   // 必须明显小于服务端的 60 秒阈值
        let heartbeatTimer = null;

        // 每条消息的唯一 id —— 服务端幂等去重的键
        //（对应 custom_config.enable_message_dedup / Core::dedupSeen）。
        //
        // 必须【每条消息一个新值】。此前的实现把 key 填成房间名，而房间名在同一
        // 房间里恒定：服务端一旦打开去重，该用户的第二条消息起会被全部当成重发
        // 而静默丢弃 —— 现象是「消息发出去没有任何反应」，且房间里其他人也收不到。
        // 服务端因此把去重开关默认关掉；客户端这边补上唯一 id，两者缺一不可。
        //
        // crypto.randomUUID 只在安全上下文（https / localhost）存在，
        // 用 file:// 直接打开这个页面时没有它，故留一个降级实现。
        function newMsgId() {
            if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
                return crypto.randomUUID();
            }
            return 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
        }

        // ── 可靠投递：本地游标（B3 / B4）─────────────────────────────────────
        //
        // 每个房间记住「我已经看到哪个序号了」，重连时把它报回服务端补齐缺口。
        // 存 localStorage 而不是内存：刷新页面 / 重开标签页同样算断线。
        //
        // ⚠️ 序号是【每实例】的。所以游标存的是 { instance, seq } —— 光有 seq
        //    说明不了任何事：带着 A 实例的 500 连到 B 实例（才发到 20），
        //    服务端只能给一个看不出原因的 206。带上归属实例后，服务端能直接说
        //    「你的游标来自另一实例，那段补不了」，客户端也不必假装补齐成功。
        const CURSOR_PREFIX = 'loong.chat.cursor.';
        const MAX_SEND_ATTEMPTS = 4;

        function cursorKey(room) {
            return CURSOR_PREFIX + room;
        }

        // 返回 { instance, seq }。兼容旧格式（以前只存了一个裸数字）。
        function loadCursor(room) {
            try {
                const raw = localStorage.getItem(cursorKey(room));
                if (!raw) return { instance: '', seq: 0 };
                if (raw[0] !== '{') return { instance: '', seq: parseInt(raw, 10) || 0 };
                const v = JSON.parse(raw);
                return { instance: v.instance || '', seq: Number(v.seq) || 0 };
            } catch (e) {
                return { instance: '', seq: 0 }; // 隐私模式下 localStorage 可能直接抛
            }
        }

        function saveCursor(room, instance, seq) {
            if (!seq) return;
            try {
                localStorage.setItem(cursorKey(room), JSON.stringify({ instance: instance || '', seq }));
            } catch (e) {
                // 存不下不影响正确性：游标只影响「下次重连能否精确补齐」
            }
        }

        // 已渲染过的消息 id（本次会话内）。补齐内容与实时投递可能重叠，
        // 按 id 去重，避免同一条显示两遍。
        const seenMsgIds = new Set();

        // 等待 ACK 的消息：requestId -> { key, text, toUser, attempts, timer }
        const pendingAcks = new Map();

        // 补齐期间收到的帧先缓冲，等 sync_done 到了再按到达顺序应用 ——
        // 否则「入群公告」这类在 sync 之前发出的消息会把游标推得比补齐内容还大，
        // 看起来像服务端倒着补。
        let syncing = false;
        let syncBuffer = [];
        // 本地游标的内存副本。localStorage 是同步 API，逐条消息都去读它没必要；
        // 这里只在前进时写回。
        let lastSeqSeen = 0;
        // 当前连着的服务实例（由 sync_done 告知）。游标要和它一起存 ——
        // 换了实例，之前那个 seq 就不再可比（见上面的说明）。
        let serverInstance = '';

        function handleAck(ack) {
            const p = pendingAcks.get(ack.requestId);
            if (!p) return;

            if (ack.code === 200) {
                pendingAcks.delete(ack.requestId);
                if (p.attempts > 1) {
                    appendSystemMessage(`第 ${p.attempts} 次尝试后投递成功`);
                }
                return;
            }

            if (ack.code === 503 && p.attempts < MAX_SEND_ATTEMPTS) {
                // 背压是【可重试】的：服务端明确说了「未投递」，退避后重发同一条。
                // key 保持不变 ⇒ 万一第一次其实投出去了，服务端会按重发去重，
                // 房间里不会出现两条。
                p.attempts++;
                const delay = Math.min(500 * Math.pow(2, p.attempts - 1), 8000);
                p.timer = setTimeout(() => resendPending(ack.requestId, p), delay);
                appendSystemMessage(`消息未投递（服务端过载），${delay}ms 后第 ${p.attempts} 次重试`);
                return;
            }

            // 404 / 400 / 重试耗尽：终态，明确告诉用户「没送出去」。
            // 这是 B1 的核心价值：旧契约下这些情况客户端只能靠猜。
            pendingAcks.delete(ack.requestId);
            appendSystemMessage(
                ack.code === 404
                    ? `${ack.message || '对方当前不在线'}（本条未送达）`
                    : `消息未送达（code=${ack.code}）：${ack.message || ''}`
            );
        }

        function resendPending(requestId, p) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                pendingAcks.delete(requestId);
                appendSystemMessage('重试时连接已断开，本条未送达');
                return;
            }
            ws.send(JSON.stringify({
                key: p.key,
                requestId: requestId,
                action: 'message',
                msgContent: p.text,
                toUser: p.toUser
            }));
        }

        function handleSyncDone(done) {
            const room = document.getElementById('roomName').value.trim();
            // 先落游标：它代表「此刻房间里最大的序号」，比缓冲里任何一条都新。
            // 服务端给的实例标识一并记下 —— 游标只在同一个实例内可比。
            if (done.instance) serverInstance = done.instance;
            lastSeqSeen = done.seq || lastSeqSeen;
            saveCursor(room, serverInstance, done.seq);
            syncing = false;

            const buf = syncBuffer;
            syncBuffer = [];
            for (const m of buf) {
                applyIncoming(m);
            }

            if (done.code === 206) {
                appendSystemMessage(`⚠️ ${done.message || '本次不是完整补齐'} —— 本端可能缺了中间的消息`);
            } else if (done.message && /已补 [1-9]/.test(done.message)) {
                appendSystemMessage(`断线期间的消息已补齐：${done.message}`);
            }
        }

        function sendHeartbeat() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            try {
                ws.send(JSON.stringify({
                    key: document.getElementById('roomName').value.trim(),
                    action: "ping",
                    msgContent: "",
                    toUser: ""
                }));
            } catch (e) {
                // 发送失败不处理：下一轮会重试，连接真断了由 onclose 收尾
            }
        }

        function startHeartbeat() {
            stopHeartbeat();
            heartbeatTimer = setInterval(sendHeartbeat, HEARTBEAT_MS);
        }

        function stopHeartbeat() {
            if (heartbeatTimer !== null) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
        }

        // 标签页隐藏时浏览器会节流定时器（隐藏 5 分钟后约 1 分钟才触发一次），
        // 刚好卡在服务端 60 秒阈值上。恢复可见时立刻补发一次。
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) sendHeartbeat();
        });

        function toggleConnect() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                // 用户主动断开：标记后 onclose 不再安排重连，并取消待执行的重连定时器
                manualClose = true;
                if (reconnectTimer !== null) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                ws.close();
            } else {
                manualClose = false;
                reconnectAttempts = 0;
                connectWebSocket();
            }
        }

        function connectWebSocket() {
            // 防重复建连：重连定时器与用户手点可能同时到达
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                return;
            }
            if (reconnectTimer !== null) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }

            const url = document.getElementById('wsUrl').value.trim();
            const room = document.getElementById('roomName').value.trim();
            const user = document.getElementById('userName').value.trim();

            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('connStatusText');
            const btnConnect = document.getElementById('btnConnect');
            const msgInput = document.getElementById('msgInput');
            const btnSend = document.getElementById('btnSend');

            try {
                const wsFullUrl = `${url}?room_name=${encodeURIComponent(room)}&name=${encodeURIComponent(user)}`;
                ws = new WebSocket(wsFullUrl);
            } catch (e) {
                alert('连接构造失败: ' + e.message);
                return;
            }

            ws.onopen = () => {
                dot.classList.add('online');
                statusText.innerText = '在线';
                statusText.style.color = 'var(--hm-teal)';
                btnConnect.innerText = '断开终端';
                btnConnect.classList.add('disconnect');
                msgInput.disabled = false;
                btnSend.disabled = false;
                msgInput.focus();
                // 连上了就清零退避计数，下次断开从 1 秒重新开始
                reconnectAttempts = 0;
                manualClose = false;
                addSystemMessage(`已进入空间 [${room}]，身份: ${user}`);
                startHeartbeat();

                // 重连补齐（B4）：把本地游标报回去，让服务端补上断线期间的消息。
                // 补齐期间到达的帧会被缓冲到 sync_done 再应用（见 handleSyncDone）。
                syncing = true;
                syncBuffer = [];
                const cur = loadCursor(room);
                serverInstance = cur.instance;
                lastSeqSeen = cur.seq;
                try {
                    ws.send(JSON.stringify({
                        action: 'sync',
                        sinceSeq: cur.seq,
                        sinceInstance: cur.instance
                    }));
                } catch (e) {
                    syncing = false; // 发不出去就别一直缓冲
                }
            };

            ws.onmessage = (event) => {
                recvTotal++;
                document.getElementById('recvCount').innerText = recvTotal.toLocaleString();

                let data;
                try {
                    data = JSON.parse(event.data);
                } catch (e) {
                    appendSystemMessage(`收到无法解析的帧：${String(event.data).slice(0, 120)}`);
                    return;
                }

                // ── 逐条 ACK（B1）────────────────────────────────────────────
                // 必须判在按 code 分类【之前】：ACK 的 code 也是 200，
                // 否则它会被当成一条聊天消息渲染出来。
                if (data.type === 'ack') {
                    handleAck(data);
                    return;
                }
                if (data.type === 'sync_done') {
                    handleSyncDone(data);
                    return;
                }

                // 补齐期间先缓冲，等 sync_done 定序之后再应用（见 handleSyncDone）
                if (syncing) {
                    syncBuffer.push(data);
                    return;
                }

                applyIncoming(data);
            };

            // 一条【已经定序】的消息的渲染逻辑。实时到达与补齐回放都走这里，
            // 保证两条路径的显示行为完全一致。
            function applyIncoming(data) {
                // 按 code 分类处理。原先只有 code===200 走聊天气泡、其余
                // 一律 JSON.stringify 成「系统态势」，于是 503（未投递）和
                // 404（对方不在线）这两类【需要用户立刻知道】的结果
                // 与「协议错误」混在一条难以阅读的原始 JSON 里。
                if (data.code === 503) {
                    appendSystemMessage(`消息未投递（服务端过载，请稍后重试）：${data.message || ''}`);
                    return;
                }
                if (data.code === 404) {
                    appendSystemMessage(data.message || '目标用户当前不在线');
                    return;
                }
                if (data.code === -1) {
                    appendSystemMessage(`协议错误：${data.message || '未知'}`);
                    return;
                }
                if (data.code !== 200) {
                    appendSystemMessage(`服务端返回 code=${data.code}：${data.message || ''}`);
                    return;
                }

                // 系统提示 / 入群 / 离群公告：服务端现在会下发 type 字段
                //（"notice" = 公告或系统提示，"message" = 真人发言）。
                //
                // 老实现只能靠猜：name 等于当前房间名、或文案里出现「加入我们 / 已离开」
                // —— 改一句公告文案就失效。现在优先信 type，只有在服务端还是旧版本
                //（帧里没有 type）时才回退到那套启发式，保证滚动升级期间客户端不倒退。
                const room = document.getElementById('roomName').value.trim();
                const isNotice =
                    data.type !== undefined
                        ? data.type === 'notice'
                        : (data.name === room ||
                           /加入我们/.test(data.message || '') ||
                           /已离开/.test(data.message || ''));
                if (isNotice) {
                    appendSystemMessage(data.message || '');
                    return;
                }

                // 压测防爆开关只跳过【聊天气泡】的 DOM 渲染，
                // 系统提示（上面几类）仍然显示，否则出错时屏幕一片死寂。
                if (document.getElementById('pauseRender').checked) {
                    return;
                }

                // 去重（B3）：补齐回放与实时投递可能重叠，同一条只渲染一次。
                // 按 id 而不是按 seq —— id 是全局唯一的 snowflake，跨实例也成立。
                if (data.id) {
                    if (seenMsgIds.has(data.id)) return;
                    seenMsgIds.add(data.id);
                    // 防内存无界增长：超过上限就丢掉最早的一半
                    if (seenMsgIds.size > 20000) {
                        const it = seenMsgIds.values();
                        for (let i = 0; i < 10000; i++) {
                            seenMsgIds.delete(it.next().value);
                        }
                    }
                }

                // 推进本地游标：只前进、不后退（补齐回放可能带来较小的 seq）。
                if (data.seq > lastSeqSeen) {
                    lastSeqSeen = data.seq;
                    saveCursor(document.getElementById('roomName').value.trim(), serverInstance, data.seq);
                }

                const myName = document.getElementById('userName').value.trim();
                const isSelf = data.name === myName;
                appendChatMessage(data.name || `User_${data.id}`, data.message, isSelf);
            }

            ws.onclose = () => {
                stopHeartbeat();
                dot.classList.remove('online');
                statusText.innerText = '已断开';
                statusText.style.color = 'var(--hm-text-secondary)';
                btnConnect.innerText = '连接终端';
                btnConnect.classList.remove('disconnect');
                msgInput.disabled = true;
                btnSend.disabled = true;

                if (manualClose) {
                    addSystemMessage('已安全退出当前空间');
                    return;
                }

                // 非主动断开 → 指数退避重连（1s, 2s, 4s ... 上限 15s）。
                if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
                    addSystemMessage(`连接已断开，自动重连 ${MAX_RECONNECT_ATTEMPTS} 次均失败，请手动重连`);
                    return;
                }
                const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), MAX_RECONNECT_DELAY_MS);
                reconnectAttempts++;
                addSystemMessage(`连接断开，${(delay / 1000).toFixed(0)} 秒后自动重连（第 ${reconnectAttempts} 次）`);
                reconnectTimer = setTimeout(() => connectWebSocket(), delay);
            };

            ws.onerror = () => {
                addSystemMessage('通信链路发生异常波动');
            };
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const content = input.value.trim();
            if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;

            const toUser = document.getElementById('toUser').value.trim();

            // key = 幂等键（重发时保持不变，服务端据此去重）；
            // requestId = 这次投递尝试的标识（服务端在 ACK 里原样回传）。
            // 这里两者取同一个值：重发的就是同一条消息，服务端也该认成同一次。
            const msgKey = newMsgId();

            // 登记待确认项：收到 ACK 之前它一直留在这里；
            // 503（未投递）时靠它退避重发，重试耗尽/404 时才提示用户失败。
            pendingAcks.set(msgKey, {
                key: msgKey,
                text: content,
                toUser: toUser,
                attempts: 1,
                timer: null
            });

            ws.send(JSON.stringify({
                key: msgKey,
                requestId: msgKey,
                action: "message",
                msgContent: content,
                toUser: toUser
            }));
            sentTotal++;
            document.getElementById('sentCount').innerText = sentTotal.toLocaleString();
            input.value = '';
        }

        function sendBatch(count) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('请先连接服务器');
                return;
            }
            // 发送缓冲保护：压测脚本原先不看 bufferedAmount 就一口气塞 1000 条，
            // 链路跟不上时这些数据会堆在浏览器内存里（表现为页面卡死、内存上涨）。
            // 这里在起跑前先判一次，超限就放弃并提示，避免把客户端自己打爆。
            if (ws.bufferedAmount > MAX_BUFFERED_BYTES) {
                addSystemMessage(`发送缓冲已积压 ${ws.bufferedAmount} 字节，已跳过本次压测发送`);
                return;
            }
            const room = document.getElementById('roomName').value.trim();
            let sent = 0;
            for (let i = 0; i < count; i++) {
                // 逐条再判一次：1000 条的过程中缓冲可能已经堆起来
                if (ws.bufferedAmount > MAX_BUFFERED_BYTES) {
                    break;
                }
                const payload = JSON.stringify({
                    key: newMsgId(),
                    action: "message",
                    msgContent: `batch_bench_msg_${i}`
                });
                ws.send(payload);
                sent++;
            }
            sentTotal += sent;
            document.getElementById('sentCount').innerText = sentTotal.toLocaleString();
            if (sent < count) {
                addSystemMessage(`压测发送提前结束：已发 ${sent}/${count} 条（发送缓冲达到上限）`);
            }
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function appendChatMessage(sender, text, isSelf) {
            const body = document.getElementById('chatBody');
            const row = document.createElement('div');
            row.className = `hm-msg-row ${isSelf ? 'self' : 'other'}`;

            const meta = document.createElement('div');
            meta.className = 'hm-meta';
            meta.innerText = `${sender} · ${new Date().toLocaleTimeString()}`;

            const bubble = document.createElement('div');
            bubble.className = 'hm-bubble';
            bubble.innerText = text;

            row.appendChild(meta);
            row.appendChild(bubble);
            body.appendChild(row);

            if (body.children.length > MAX_MESSAGES) {
                body.removeChild(body.firstChild);
            }

            body.scrollTop = body.scrollHeight;
        }

        function addSystemMessage(text) {
            const body = document.getElementById('chatBody');
            const row = document.createElement('div');
            row.className = 'hm-msg-row system';

            const bubble = document.createElement('div');
            bubble.className = 'hm-bubble';
            bubble.innerText = `${new Date().toLocaleTimeString()} - ${text}`;

            row.appendChild(bubble);
            body.appendChild(row);
            body.scrollTop = body.scrollHeight;
        }

        function clearMessages() {
            document.getElementById('chatBody').innerHTML = '';
        }

        // ==========================================
        // 鸿蒙纯血微动粒子引擎 (轻量高效、零阻塞主线程)
        // ==========================================
        (function initParticles() {
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w = canvas.width = window.innerWidth;
            let h = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            });

            const PARTICLE_COUNT = 48;
            const particles = [];

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 1.6 + 0.6,
                    vx: (Math.random() - 0.5) * 0.35,
                    vy: (Math.random() - 0.5) * 0.35,
                    alpha: Math.random() * 0.5 + 0.2,
                    dAlpha: (Math.random() * 0.008 + 0.003) * (Math.random() > 0.5 ? 1 : -1)
                });
            }

            function render() {
                ctx.clearRect(0, 0, w, h);

                // 绘制柔和星芒微尘
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0) p.x = w;
                    else if (p.x > w) p.x = 0;
                    if (p.y < 0) p.y = h;
                    else if (p.y > h) p.y = 0;

                    p.alpha += p.dAlpha;
                    if (p.alpha > 0.75 || p.alpha < 0.15) {
                        p.dAlpha = -p.dAlpha;
                    }

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(160, 205, 255, ${p.alpha})`;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(91, 141, 239, 0.6)';
                    ctx.fill();

                    // 局部微连线（鸿蒙星联感觉）
                    for (let j = i + 1; j < particles.length; j++) {
                        const p2 = particles[j];
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 85) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = `rgba(100, 165, 255, ${(1 - dist / 85) * 0.12})`;
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(render);
            }

            render();
        })();
    </script>
</body>
</html>
