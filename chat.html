        .blob-3 {

        @keyframes auroraFloat {
            0% { transform: translate(0, 0) scale(1); }

    <script>
        let ws = null;
        let sentTotal = 0;
        let recvTotal = 0;
        let lastRecv = 0;

        // 窗口初始化：随机独立昵称
        window.addEventListener('DOMContentLoaded', () => {
            const randomId = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('userName').value = `User_${randomId}`;
        });

        // 环形缓冲：最多保留 200 条，杜绝 DOM 树无界膨胀
        const MAX_MESSAGES = 200;

        // QPS 吞吐量实时计算器 (每秒计算)
        setInterval(() => {
            const currentQps = recvTotal - lastRecv;
            lastRecv = recvTotal;
            document.getElementById('qpsVal').innerText = `${currentQps.toLocaleString()} msg/s`;
        }, 1000);

        // ------------------------------------------------------------------
        // 应用层心跳
        //
        // 服务端每 5 秒扫描一次连接，超过 60 秒没收到【客户端任意帧】就 forceClose。
        //
        // 注意：drogon 的 HttpServer 对每条 WebSocket 连接默认执行
        //   wsConn->setPingMessage("", 30s)
        // 即每 30 秒主动发一次协议层 Ping，浏览器会自动回 Pong —— 而 Pong 同样会
        // 刷新服务端的活动时间。所以正常情况下连接不会被误杀，这条应用层心跳属于
        // 【纵深防御】：它探测的是「TCP/协议栈还活着、但前端 JS 已经卡死」的场景，
        // 那种情况下协议层 Pong 仍会自动回复，只有应用层心跳会停。
        //
        // 心跳用 action="ping"：服务端只在 action=="message" 时才广播，
        // 因此它不会出现在聊天记录里，也不计入 QPS 统计。
        // ------------------------------------------------------------------
        const HEARTBEAT_MS = 25000;   // 必须明显小于服务端的 60 秒阈值
        let heartbeatTimer = null;

        function sendHeartbeat() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            try {
                ws.send(JSON.stringify({
                    key: document.getElementById('roomName').value.trim(),
                    action: "ping",
                    msgContent: "",
                    toUser: ""
                }));
            } catch (e) {
                // 发送失败不处理：下一轮会重试，连接真断了由 onclose 收尾
            }
        }

        function startHeartbeat() {
            stopHeartbeat();
            heartbeatTimer = setInterval(sendHeartbeat, HEARTBEAT_MS);
        }

        function stopHeartbeat() {
            if (heartbeatTimer !== null) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
        }

        // 标签页隐藏时浏览器会节流定时器（隐藏 5 分钟后约 1 分钟才触发一次），
        // 刚好卡在服务端 60 秒阈值上。恢复可见时立刻补发一次。
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) sendHeartbeat();
        });

        function toggleConnect() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                ws.close();
            } else {
                connectWebSocket();
            }
        }

        function connectWebSocket() {
            const url = document.getElementById('wsUrl').value.trim();
            const room = document.getElementById('roomName').value.trim();
            const user = document.getElementById('userName').value.trim();

            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('connStatusText');
            const btnConnect = document.getElementById('btnConnect');
            const msgInput = document.getElementById('msgInput');
            const btnSend = document.getElementById('btnSend');

            try {
                const wsFullUrl = `${url}?room_name=${encodeURIComponent(room)}&name=${encodeURIComponent(user)}`;
                ws = new WebSocket(wsFullUrl);
            } catch (e) {
                alert('连接构造失败: ' + e.message);
                return;
            }

            ws.onopen = () => {
                dot.classList.add('online');
                statusText.innerText = '在线';
                statusText.style.color = 'var(--hm-teal)';
                btnConnect.innerText = '断开终端';
                btnConnect.classList.add('disconnect');
                msgInput.disabled = false;
                btnSend.disabled = false;
                msgInput.focus();
                addSystemMessage(`已进入空间 [${room}]，身份: ${user}`);
                startHeartbeat();
            };

            ws.onmessage = (event) => {
                recvTotal++;
                document.getElementById('recvCount').innerText = recvTotal.toLocaleString();

                if (document.getElementById('pauseRender').checked) {
                    return;
                }

                try {
                    const data = JSON.parse(event.data);
                    if (data.code === 200) {
                        const myName = document.getElementById('userName').value.trim();
                        const isSelf = data.name === myName;
                        appendChatMessage(data.name || `User_${data.id}`, data.message, isSelf);
                    } else {
                        appendChatMessage('系统态势', JSON.stringify(data), false);
                    }
                } catch (e) {
                    appendChatMessage('原始帧', event.data, false);
                }
            };

            ws.onclose = () => {
                stopHeartbeat();
                dot.classList.remove('online');
                statusText.innerText = '已断开';
                statusText.style.color = 'var(--hm-text-secondary)';
                btnConnect.innerText = '连接终端';
                btnConnect.classList.remove('disconnect');
                msgInput.disabled = true;
                btnSend.disabled = true;
                addSystemMessage('已安全退出当前空间');
            };

            ws.onerror = () => {
                addSystemMessage('通信链路发生异常波动');
            };
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const content = input.value.trim();
            if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;

            const toUser = document.getElementById('toUser').value.trim();

            const payload = JSON.stringify({
                key: document.getElementById('roomName').value.trim(),
                action: "message",
                msgContent: content,
                toUser: toUser
            });

            ws.send(payload);
            sentTotal++;
            document.getElementById('sentCount').innerText = sentTotal.toLocaleString();
            input.value = '';
        }

        function sendBatch(count) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('请先连接服务器');
                return;
            }
            const room = document.getElementById('roomName').value.trim();
            for (let i = 0; i < count; i++) {
                const payload = JSON.stringify({
                    key: room,
                    action: "message",
                    msgContent: `batch_bench_msg_${i}`
                });
                ws.send(payload);
                sentTotal++;
            }
            document.getElementById('sentCount').innerText = sentTotal.toLocaleString();
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function appendChatMessage(sender, text, isSelf) {
            const body = document.getElementById('chatBody');
            const row = document.createElement('div');
            row.className = `hm-msg-row ${isSelf ? 'self' : 'other'}`;

            const meta = document.createElement('div');
            meta.className = 'hm-meta';
            meta.innerText = `${sender} · ${new Date().toLocaleTimeString()}`;

            const bubble = document.createElement('div');
            bubble.className = 'hm-bubble';
            bubble.innerText = text;

            row.appendChild(meta);
            row.appendChild(bubble);
            body.appendChild(row);

            if (body.children.length > MAX_MESSAGES) {
                body.removeChild(body.firstChild);
            }

            body.scrollTop = body.scrollHeight;
        }

        function addSystemMessage(text) {
            const body = document.getElementById('chatBody');
            const row = document.createElement('div');
            row.className = 'hm-msg-row system';

            const bubble = document.createElement('div');
            bubble.className = 'hm-bubble';
            bubble.innerText = `${new Date().toLocaleTimeString()} - ${text}`;

            row.appendChild(bubble);
            body.appendChild(row);
            body.scrollTop = body.scrollHeight;
        }

        function clearMessages() {
            document.getElementById('chatBody').innerHTML = '';
        }

        // ==========================================
        // 鸿蒙纯血微动粒子引擎 (轻量高效、零阻塞主线程)
        // ==========================================
        (function initParticles() {
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w = canvas.width = window.innerWidth;
            let h = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            });

            const PARTICLE_COUNT = 48;
            const particles = [];

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 1.6 + 0.6,
                    vx: (Math.random() - 0.5) * 0.35,
                    vy: (Math.random() - 0.5) * 0.35,
                    alpha: Math.random() * 0.5 + 0.2,
                    dAlpha: (Math.random() * 0.008 + 0.003) * (Math.random() > 0.5 ? 1 : -1)
                });
            }

            function render() {
                ctx.clearRect(0, 0, w, h);

                // 绘制柔和星芒微尘
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0) p.x = w;
                    else if (p.x > w) p.x = 0;
                    if (p.y < 0) p.y = h;
                    else if (p.y > h) p.y = 0;

                    p.alpha += p.dAlpha;
                    if (p.alpha > 0.75 || p.alpha < 0.15) {
                        p.dAlpha = -p.dAlpha;
                    }

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(160, 205, 255, ${p.alpha})`;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(91, 141, 239, 0.6)';
                    ctx.fill();

                    // 局部微连线（鸿蒙星联感觉）
                    for (let j = i + 1; j < particles.length; j++) {
                        const p2 = particles[j];
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 85) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = `rgba(100, 165, 255, ${(1 - dist / 85) * 0.12})`;
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(render);
            }

            render();
        })();
    </script>
